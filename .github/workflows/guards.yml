# Cheap, fast repo guards that need no Apple toolchain.
#
# These run on ubuntu-latest, which bills at 1x. The macOS runners in
# tests.yml bill at 10x, so a 14-minute UI test job costs 140 of the 2,000
# minutes a GitHub Free private repo gets each month. Anything that does not
# genuinely need Xcode belongs here instead.
#
# Building and testing the app moves to Xcode Cloud (25 compute hours/month,
# included with the Apple Developer Program). Once that is verified green on a
# pull request, tests.yml is deleted and this is the only GitHub Actions
# workflow left.

name: Guards

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  language-guard:
    name: Language-consistency guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # Guard for the activity-aware language layer (Round C, 2026-08-30):
      # user-facing copy must read the session's activity, never a hardcoded
      # "walk". Fails the build if any of these literals reappear.
      - name: Language-consistency guard
        run: |
          if grep -rn '"Still walking\|"Walk Paused"\|"End Walk"\|"Walk Complete\|"Walk History"\|"Finish Walk"\|"Resume Your Walk' \
               PoCSquat/Views PoCSquat/Intents WocketWidget --include="*.swift"; then
            echo "::error::Hardcoded walk-specific copy found — use ActivityMode.noun/gerund/sessionLabel instead."
            exit 1
          fi
          echo "Language guard passed."

  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SwiftLint needs a Swift toolchain but not Xcode, so it runs here on the
    # 1x Linux runner rather than on a 10x macOS one. The official image ships
    # the binary, so there is nothing to install.
    container: ghcr.io/realm/swiftlint:0.57.0

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # .swiftlint.yml was added 2026-08-30 with force_unwrapping, force_cast
      # and force_try set to `error`. The step that ran it lived in tests.yml,
      # which the 2026-09-04 Xcode Cloud migration deleted — so from that date
      # until now the config existed but nothing executed it.
      #
      # Restored 2026-09-07 as report-only while the backlog was triaged. All 32
      # error-severity violations were cleared on 2026-09-08 and the job now fails
      # on any new one. The gate was break-tested: a planted force-unwrap is
      # reported before this line was removed. NOTE: this job is not yet in the
      # ruleset's required checks — it goes red but does not block a merge until
      # it is added there.
      - name: SwiftLint
        run: swiftlint lint --reporter github-actions-logging
