name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run unit tests
    runs-on: macos-26

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # Guard for the activity-aware language layer (Round C, 2026-08-30):
      # user-facing copy must read the session's activity, never a hardcoded
      # "walk". Fails the build if any of these literals reappear.
      - name: Language-consistency guard
        run: |
          if grep -rn '"Still walking\|"Walk Paused"\|"End Walk"\|"Walk Complete\|"Walk History"\|"Finish Walk"\|"Resume Your Walk' \
               PoCSquat/Views PoCSquat/Intents WocketWidget --include="*.swift"; then
            echo "::error::Hardcoded walk-specific copy found — use ActivityMode.noun/gerund/sessionLabel instead."
            exit 1
          fi
          echo "Language guard passed."

      # Non-blocking lint report (force_unwrapping / force_try / force_cast).
      # Flip continue-on-error to false once the existing sites are triaged.
      - name: SwiftLint (report only)
        continue-on-error: true
        run: |
          brew install swiftlint >/dev/null 2>&1 || true
          swiftlint lint --config .swiftlint.yml --reporter github-actions-logging || true

      - name: Run tests (WockettTests)
        run: |
          xcodebuild test \
            -project PoCSquat.xcodeproj \
            -scheme PoCSquat \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:WockettTests \
            CODE_SIGNING_ALLOWED=NO

  ui-test:
    name: Run UI smoke tests
    runs-on: macos-26

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # UI tests drive the real app in a simulator. They are slower than the
      # unit tests and live in their own job so a failure here is obviously a
      # navigation/layout regression rather than a logic one. The app seeds
      # deterministic demo data and disables animations under -WKTUITest.
      - name: Run UI smoke tests (WockettUITests)
        run: |
          xcodebuild test \
            -project PoCSquat.xcodeproj \
            -scheme PoCSquat \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:WockettUITests \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -retry-tests-on-failure -test-iterations 3 \
            -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # On failure the result bundle holds the screenshot and view hierarchy at
      # the moment of failure — the fastest way to see what the app looked like.
      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: UITestResults.xcresult
          retention-days: 7
