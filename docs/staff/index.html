<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <!-- Content Security Policy (GitHub Pages can't send headers, so it is a
       meta tag): scripts only from this folder and Apple's CloudKit JS CDN,
       network only to CloudKit, frames only from Apple (the sign-in button and
       sign-in flow), no plugins, no forms, no base URL tricks. A script that
       slipped into the page could not load code or send data elsewhere. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.apple-cloudkit.com; connect-src https://api.apple-cloudkit.com https://*.apple-cloudkit.com; style-src 'self' 'unsafe-inline' https://cdn.apple-cloudkit.com; img-src 'self' data: https://*.apple-cloudkit.com https://*.icloud.com https://*.apple.com; frame-src https://*.apple-cloudkit.com https://*.apple.com https://*.icloud.com; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Wockett Staff</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Apple's CloudKit JS, from Apple. The only script not in this folder. -->
  <script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">Wockett Staff</div>
    <label class="env">
      <span class="visually-hidden">Environment</span>
      <select id="env-select">
        <option value="production">Production</option>
        <option value="development">Development</option>
      </select>
    </label>
    <div id="who" class="who small muted"></div>
    <div id="apple-sign-out" class="signout"></div>
  </header>
  <div id="env-banner" class="banner" hidden></div>
  <nav id="tabs" class="tabs" hidden>
    <button data-view="reports" aria-current="page">Reports</button>
    <button data-view="browse">Browse</button>
    <button data-view="activity">Activity</button>
    <button data-view="nominations">Nominations</button>
    <button data-view="featured">Featured</button>
    <button data-view="walker">Walker reports</button>
    <button data-view="suggestions">Trail suggestions</button>
    <button data-view="suspensions">Suspensions</button>
    <button data-view="history">History</button>
  </nav>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <main id="main">
    <p class="muted">Loading…</p>
  </main>
  <div id="apple-sign-in" class="signin"></div>
  <dialog id="dialog"></dialog>
</body>
</html>
