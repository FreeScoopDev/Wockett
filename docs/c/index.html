<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Wockett challenge</title>
    <meta property="og:title" content="Join a challenge on Wockett">
    <meta property="og:description" content="Walk, run or ride together. Open the link on your iPhone to join.">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #000; color: #f5f5f7;
               min-height: 100vh; display: flex; flex-direction: column; }
        main { flex: 1; max-width: 520px; width: 100%; margin: 0 auto; padding: 72px 16px 40px; text-align: center; }
        .emoji { font-size: 3.5em; line-height: 1; margin-bottom: 20px; }
        h1 { font-size: 1.15em; font-weight: 600; color: #86868b; }
        h2 { font-size: 2em; font-weight: 700; letter-spacing: -0.5px; margin-top: 8px; overflow-wrap: anywhere; }
        p.lead { font-size: 1.05em; color: #c7c7cc; line-height: 1.5; margin-top: 16px; }
        a.get { display: inline-block; margin-top: 32px; padding: 14px 28px; border-radius: 14px; background: #34c759;
                color: #000; font-weight: 600; font-size: 1.05em; text-decoration: none; }
        a.get:focus-visible { outline: 3px solid #f5f5f7; outline-offset: 3px; }
        p.hint { font-size: 0.9em; color: #86868b; line-height: 1.5; margin-top: 28px; }
        footer { text-align: center; padding: 32px 16px; border-top: 1px solid #1c1c1e; color: #8e8e93; font-size: 0.85em; }
        footer a { color: #4ea1ff; text-decoration: none; }
    </style>
    <script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js" defer></script>
    <script type="module" src="page.js"></script>
</head>
<body>
<main>
    <div class="emoji" id="emoji" aria-hidden="true">🏆</div>
    <h1>Wockett challenge</h1>
    <h2 id="title" hidden></h2>
    <p class="lead" id="lead">You’re invited to a challenge on Wockett. Get the app, then open the link again to join.</p>
    <a class="get" href="https://apps.apple.com/app/id6794364736">Get Wockett on the App Store</a>
    <p class="hint">Already have Wockett? Open this link on your iPhone, or find the challenge in the app under Community → Challenges.</p>
    <noscript><p class="hint">Turn on JavaScript to see the challenge’s name.</p></noscript>
</main>
<footer>
    <a href="/">Wockett</a> · <a href="/privacy-policy.html">Privacy Policy</a>
</footer>
</body>
</html>
